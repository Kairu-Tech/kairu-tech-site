<!doctype html>
<html lang="es">
<head>

<body>
<section id="login" class="login-wrap">

</form></section>
<div class="shell" hidden>
<aside class="sidebar">
<div class="brand"><span class="brand-icon" aria-hidden="true">K</span><div><strong>KairuTech</strong><small>Operaciones comerciales</small></div></div>

</aside>
<main>
<header class="top"><span id="breadcrumb">Seguimiento comercial</span><div class="top-actions"><button type="button" data-action="export">Exportar CSV</button><button type="button" data-action="logout">Salir</button><button type="button" class="primary" data-action="new">＋ Nueva oportunidad</button></div></header>
<div id="page" class="page" aria-live="polite"><p>Cargando panel…</p></div>

</div>
