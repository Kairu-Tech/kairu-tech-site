<body>
<section id="login" class="login-wrap">
<form id="login-form" class="login-card">
<div class="brand"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.9l2.15 6.02h6.39l-5.17 3.76 1.98 6.02L12 15.01 6.65 18.7l1.98-6.02-5.17-3.76h6.39L12 2.9z"/></svg><span class="brand-word">Kairu <span class="brand-tech">Tech</span></span></div>
<h1>Tu seguimiento comercial</h1>
<p>Accede a tu espacio privado.</p>
<label>Email<input name="email" type="email" autocomplete="username" required></label>
<label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
<p id="login-error" class="error" role="alert"></p>
<button type="submit" class="primary">Entrar</button>
<button type="button" id="forgot-password">He olvidado mi contraseña</button>
</form>
<form id="reset-form" class="login-card" hidden>
<div class="brand"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.9l2.15 6.02h6.39l-5.17 3.76 1.98 6.02L12 15.01 6.65 18.7l1.98-6.02-5.17-3.76h6.39L12 2.9z"/></svg><span class="brand-word">Kairu <span class="brand-tech">Tech</span></span></div>
<h1>Nueva contraseña</h1>
<p>Escribe la contraseña que utilizarás para entrar al CRM.</p>
<label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Repetir contraseña<input name="confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
<p id="reset-error" class="error" role="alert"></p>
<button type="submit" class="primary">Guardar contraseña</button>
<button type="button" id="cancel-reset">Volver al acceso</button>
</form><form id="mfa-form" class="login-card" hidden>
<h1>Verificación de seguridad</h1>
<p id="mfa-help"></p><img id="mfa-qr" width="240" height="240" alt="Código QR para configurar el autenticador" hidden><p id="mfa-secret" hidden></p>
<label>Código de seis dígitos<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
<p id="mfa-error" class="error" role="alert"></p>
<button type="submit" class="primary">Verificar</button>
<button type="button" id="cancel-mfa">Cancelar y salir</button>
</form></section>
<div class="shell" hidden>
<aside class="sidebar">
<div class="brand"><svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.9l2.15 6.02h6.39l-5.17 3.76 1.98 6.02L12 15.01 6.65 18.7l1.98-6.02-5.17-3.76h6.39L12 2.9z"/></svg><div><span class="brand-word">Kairu <span class="brand-tech">Tech</span></span><small>Operaciones comerciales</small></div></div>
<nav aria-label="Navegación principal" id="nav"></nav>
<div class="profile"><span class="avatar">AB</span><div><strong>Alex Barrena</strong><small>Espacio privado</small></div></div>
</aside>
<main>
<header class="top"><span id="breadcrumb">Seguimiento comercial</span><div class="top-actions"><button type="button" data-action="import">Importar Excel/CSV</button><button type="button" data-action="export">Exportar CSV</button><button type="button" data-action="logout">Salir</button><button type="button" class="primary" data-action="new">＋ Nueva oportunidad</button></div></header>
<div id="page" class="page" aria-live="polite"><p>Cargando panel…</p></div>
</main>
</div>
<dialog id="modal" aria-label="Ficha comercial"><div id="modal-content"></div></dialog>
<div id="toast" role="status" hidden></div>
